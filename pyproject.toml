[project]
name = "clip-keeper"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["clip_keeper"]
# GTK view code needs a desktop session; it is smoke-tested by hand (see README).
omit = ["clip_keeper/tray.py", "clip_keeper/popup.py", "clip_keeper/clipboard.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
